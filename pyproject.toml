[tool.poetry]
name = "ciscosupportsdk"
version = "0.2.2"
description = "Cisco Support APIs allow Cisco Partner Support Services (PSS) partners and Cisco Smart Net Total Care (SNTC) customers to programmatically access and consume Cisco Support data in the cloud in a simple, secure, and scalable manner."
authors = ["Manny Garcia <supermanny@icloud.com>"]
license = "MIT"
keywords = ['cisco', 'cisco-support', 'python-sdk']
readme = "README.rst"
homepage = "https://supermanny81.github.io/ciscosupportapi/"
repository = "https://github.com/supermanny81/ciscosupportapi"
include = ["LICENSE.txt"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.27.1"
Authlib = "^1.2.1"
pydantic = "^1.9.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^5.10.1"
pytest = "^9.0.3"
pytest-cov = "^3.0.0"
pytest-recording = "^0.13.0"
Sphinx = "^7.0.0"
sphinx-autobuild = "^2024.2.4"
flake8 = "^4.0.1"
bandit = "^1.7.3"
pip-audit = "^2.7.0"
vcrpy = "^8.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# The api/*_test.py modules import the shared fixtures module via
# `from fixtures import *`. Put its directory on sys.path explicitly so
# collection does not depend on ordering (pytest 8+ no longer inserts it
# implicitly).
pythonpath = ["tests/ciscosupportsdk"]

[tool.isort]
# make it compatible with black
profile = "black"
line_length = 79

[tool.black]
line-length = 79

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError()",
    "pragma: nocover",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true

[tool.coverage.run]
branch = true
parallel = true

[tool.poetry.extras]
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "sphinx.ext.viewcode",
    "sphinx.ext.intersphinx"
    ]
