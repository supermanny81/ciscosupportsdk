name: docs
on:
  push:
    tags: '*'
  pull_request:
    branches:
      - master

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv
      # Pinned exactly: setup-uv publishes no floating major tag past v6,
      # so @v10 does not resolve.
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Install
      run: uv sync --locked --all-groups
    - name: Build documentation
      run: |
        mkdir gh-pages
        touch gh-pages/.nojekyll
        cd docs/
        uv run sphinx-build -b html . _build
        cp -r _build/* ../gh-pages/
    - name: Deploy documentation
      if: ${{ github.event_name == 'push' }}
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        branch: gh-pages
        folder: gh-pages
