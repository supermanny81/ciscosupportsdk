name: tests
on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --locked fails the build if uv.lock is out of step with
        # pyproject.toml, rather than silently resolving something else.
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest --cov=./ --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
  code-quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run ruff format
        run: uv run ruff format . --check
      - name: Run ruff (imports)
        run: uv run ruff check .
      - name: Run flake8
        run: uv run flake8 .
      - name: Run bandit
        # -r is required; without it bandit skips the directory and scans
        # nothing. Scoped to src/ so pytest's asserts in tests/ are not
        # reported as B101.
        run: uv run bandit -r src/
      - name: Run pip-audit
        # No seed-tool upgrade needed: unlike the poetry environment, the uv
        # venv carries no pip or setuptools of its own, so their advisories
        # cannot fail the audit of the project's actual dependencies.
        run: uv run pip-audit
